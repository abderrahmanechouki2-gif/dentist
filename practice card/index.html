<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Service Card</title>
  <style>
    /* Reset & Center Container */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Dark blue-to-black gradient background to highlight glassmorphism */
      background: linear-gradient(135deg, #020b14 0%, #0a192f 50%, #000000 100%);
    }

    /* Glassmorphic Card Styling */
    .card {
      position: relative;
      width: 300px;
      padding: 30px 24px;
      border-radius: 20px;
      
      /* Glassmorphism setup */
      background: rgba(10, 25, 47, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 198, 255, 0.15);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      overflow: hidden;
      
      /* Smooth Hover Transition */
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Top Accent Line (Glow effect) */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      opacity: 0.6;
      transition: opacity 0.4s ease;
    }

    /* Hover State for Main Card */
    .card:hover {
      transform: translateY(-10px);
      border-color: rgba(0, 198, 255, 0.5);
      box-shadow: 0 15px 40px rgba(0, 114, 255, 0.25);
    }

    .card:hover::before {
      opacity: 1;
    }

    /* Icon Styling */
    .card-icon {
      font-size: 2.8rem;
      margin-bottom: 16px;
      display: inline-block;
      transition: transform 0.4s ease;
      filter: drop-shadow(0 0 10px rgba(0, 198, 255, 0.3));
    }

    .card:hover .card-icon {
      transform: scale(1.15) rotate(5deg);
    }

    /* Title Styling */
    .card-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    /* Description Styling */
    .card-description {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    /* Premium Glow Button Styling */
    .card-btn {
      text-decoration: none;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(0, 198, 255, 0.2), rgba(0, 114, 255, 0.2));
      border: 1px solid rgba(0, 198, 255, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .card-btn span {
      transition: transform 0.3s ease;
    }

    /* Button Hover Effect */
    .card-btn:hover {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      box-shadow: 0 0 15px rgba(0, 198, 255, 0.5);
      border-color: transparent;
    }

    .card:hover .card-btn span {
      transform: translateX(4px);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-icon">🦷</div>
    <h3 class="card-title">Teeth Whitening</h3>
    <p class="card-description">Professional whitening treatments.</p>
    <a href="https://dentist-eta-ten.vercel.app/" class="card-btn">
      Learn More <span>→</span>
    </a>
  </div>

</body>
</html>
